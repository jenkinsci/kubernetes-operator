name: Publish nightly snapshot
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      skipTests:
        description: "Flag for skipping the tests. If set to true (without quotation marks), the workflow will skip tests and go straight to releasing the nightly build. Use with caution!"
        required: false

jobs:
  verify-code:
    name: Verify code and create tests matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Prep - check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prep - Set up env vars
        run: |
          echo "GO111MODULE=on" >> $GITHUB_ENV
          echo "GO_VERSION=v$(sed -n 's/^GO_VERSION=//p' config.base.env | tr -d '\n' | tr -d '"')" >> $GITHUB_ENV
          echo "GOPATH=/home/runner/go" >> $GITHUB_ENV

      - name: Prep - go environment
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Prep - Ensure Golang runtime dependencies
        run: make go-dependencies

      - name: Test - verify code formatting
        run: make verify

      - name: Prep - create tests matrix
        id: matrix
        if: ${{ github.event.inputs.skipTests != 'true' }}
        run: |
          e2e=$(./test/make_matrix_ginkgo.sh e2e)
          helm=$(./test/make_matrix_ginkgo.sh helm)
          bats=$(printf '%s\n' test/bats/*.bats | jq -Rsc 'split("\n")[:-1] | map({suite: "bats", test: (split("/")[-1])})')
          matrix=$(jq -cn --argjson e2e "$e2e" --argjson helm "$helm" --argjson bats "$bats" \
            '{include: (($e2e.include | map(. + {suite: "e2e"})) + ($helm.include | map(. + {suite: "helm"})) + $bats)}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  run-tests:
    name: Nightly ${{ matrix.suite }} - ${{ matrix.test }}
    needs: [verify-code]
    if: ${{ github.event.inputs.skipTests != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify-code.outputs.matrix) }}
    steps:
      - name: Prep - check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prep - Set up env vars
        run: |
          echo "GO111MODULE=on" >> $GITHUB_ENV
          echo "GO_VERSION=v$(sed -n 's/^GO_VERSION=//p' config.base.env | tr -d '\n' | tr -d '"')" >> $GITHUB_ENV
          echo "HELM_VERSION=v$(sed -n 's/HELM_VERSION=//p' config.base.env | tr -d '\n' | tr -d '"')" >> $GITHUB_ENV
          echo "KIND_CLUSTER_NAME=$(sed -n 's/KIND_CLUSTER_NAME=//p' config.base.env | tr -d '\n' | tr -d '"')" >> $GITHUB_ENV
          echo "GOPATH=/home/runner/go" >> $GITHUB_ENV

      - name: Prep - go environment
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Prep - Ensure Golang runtime dependencies
        run: make go-dependencies

      - name: Prep - setup Bats and bats libs
        if: ${{ matrix.suite == 'bats' }}
        uses: bats-core/bats-action@472edde1138d59aca53ff162fb8d996666d21e4a # 2.0.0
        with:
          support-path: "${{ github.workspace }}/.bats/bats-support"
          assert-path: "${{ github.workspace }}/.bats/bats-assert"
          detik-path: "${{ github.workspace }}/.bats/bats-detik"
          file-path: "${{ github.workspace }}/.bats/bats-file"

      - name: Prep - Kubernetes dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y socat
          sudo mkdir -p $HOME/.kube
          sudo chown -R $USER $HOME/.kube

      - name: Prep - Kind setup
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: ${{env.KIND_CLUSTER_NAME}}
          config: kind-cluster.yaml

      - name: Test - e2e
        if: ${{ matrix.suite == 'e2e' }}
        env:
          TNAME: ${{ matrix.test }}
        run: make e2e E2E_TEST_ARGS='-ginkgo.v -ginkgo.focus="${TNAME}"'

      - name: Test - Helm Chart
        if: ${{ matrix.suite == 'helm' }}
        env:
          TNAME: ${{ matrix.test }}
        run: |
          git reset --hard
          make helm-lint
          make helm-e2e E2E_TEST_ARGS='-ginkgo.v -ginkgo.focus="${TNAME}"'

      - name: Test - bats
        if: ${{ matrix.suite == 'bats' }}
        env:
          BATS_LIB_PATH: "${{ github.workspace }}/.bats"
          BATS_TEST_PATH: ${{ matrix.test }}
        run: make bats-tests

  publish-image:
    name: Publish nightly snapshot
    needs: [verify-code, run-tests]
    if: >-
      ${{ !cancelled() && needs.verify-code.result == 'success' &&
          (needs.run-tests.result == 'success' ||
           (github.event.inputs.skipTests == 'true' && needs.run-tests.result == 'skipped')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Prep - check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prep - Set up env vars
        run: |
          echo "GO111MODULE=on" >> $GITHUB_ENV
          echo "GO_VERSION=v$(sed -n 's/^GO_VERSION=//p' config.base.env | tr -d '\n' | tr -d '"')" >> $GITHUB_ENV
          echo "GOPATH=/home/runner/go" >> $GITHUB_ENV

      - name: Prep - go environment
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Prep - Ensure Golang runtime dependencies
        run: make go-dependencies

      - name: Post - Login to Quay.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAYIO_USERNAME }}
          password: ${{ secrets.QUAYIO_TOKEN }}

      - name: Post - Push image
        run: |
          git reset --hard
          make container-runtime-snapshot-push
