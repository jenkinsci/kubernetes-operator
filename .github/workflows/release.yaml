name: Release Operator
on:
  workflow_dispatch:

jobs:
  build-and-release:
    name: Release Operator, build and push newest image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up env vars
        run: |
          echo "GO111MODULE=on" >> $GITHUB_ENV
          echo "GO_VERSION=v$(sed -n 's/^GO_VERSION=//p' config.base.env | tr -d '\n' | tr -d '"')" >> $GITHUB_ENV
          echo "GOPATH=/home/runner/go" >> $GITHUB_ENV

      - name: Prepare go environment
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Ensure Golang runtime dependencies
        run: make go-dependencies

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set version for release tag name
        run: |
          echo "VERSION=$(cat VERSION.txt)" >> $GITHUB_ENV

      - name: Check chart release is merged
        run: |
          chart_package="chart/jenkins-operator/jenkins-operator-${VERSION#v}.tgz"
          test -f "$chart_package"
          packaged_version=$(tar -xOf "$chart_package" jenkins-operator/Chart.yaml | sed -n 's/^appVersion: //p' | tr -d '"')
          test "$packaged_version" = "${VERSION#v}"

      - name: Tag the release
        run: make tag

      - name: Login to Quay.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAYIO_USERNAME }}
          password: ${{ secrets.QUAYIO_TOKEN }}

      - name: Build and push the image to Quay.io
        run: |
          git reset --hard
          if [[ "$VERSION" == *-* ]]; then
            make container-runtime-release-version
          else
            make container-runtime-release
          fi

      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.VERSION }}
          draft: true
          prerelease: ${{ contains(env.VERSION, '-') }}
