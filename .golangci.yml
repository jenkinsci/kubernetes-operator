version: "2"
run:
  timeout: 5m
  allow-parallel-runners: true
output:
  sort-order:
    - file
    - severity
    - linter
linters:
  default: none
  settings:
    staticcheck:
      checks: ["all", "-ST*", "-QF*"]
    goconst:
      ignore-tests: true
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - loggercheck
    - misspell
    - nakedret
    - staticcheck
    - unconvert
    - unparam
    - unused
  exclusions:
    generated: lax
    rules:
      - linters:
          - staticcheck
        text: 'SA1019: .*\.Requeue is deprecated'
      - linters:
          - dupl
        path: internal/*
      - linters:
          - dupl
        path: (.+)_test.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
