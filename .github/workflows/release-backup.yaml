name: Release Backup Pvc
on:
  workflow_dispatch:
  pull_request:
    types: [edited, opened, reopened, synchronize]
    paths:
      - 'backup/pvc/**'
      - '.github/workflows/release-backup.yaml'

  push:
    branches:
      - master
      - main
    tags: ["*"]
    paths:
      - 'backup/pvc/**'
      - '.github/workflows/release-backup.yaml'

jobs:
  test-backup:
    name: Backup tests (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up QEMU (for cross-arch emulation)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the e2e image without pushing
        run: >-
          make -C backup/pvc docker-buildx
          PLATFORMS=${{ matrix.platform }} BUILDX_OUTPUT=type=docker
          UID=1001 GID=1001 GITCOMMIT=ci-backup

      - name: Verify image platform
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
        run: |
          actual_platform=$(docker image inspect quay.io/jenkins-kubernetes-operator/backup-pvc:ci-backup --format '{{.Os}}/{{.Architecture}}')
          test "$actual_platform" = "$EXPECTED_PLATFORM"

      - name: Run the e2e tests
        env:
          DOCKER_DEFAULT_PLATFORM: ${{ matrix.platform }}
        run: make -C backup/pvc docker-test GITCOMMIT=ci-backup

  build-and-release-backup:
    name: Release Backup Pvc, build, bump and push new image
    needs: test-backup
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Bump the version
        shell: bash
        run: |
          make -C backup/pvc sembump
          make -C backup/pvc bump-version

      - name: Login to Quay.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAYIO_USERNAME }}
          password: ${{ secrets.QUAYIO_TOKEN }}

      - name: Set up QEMU (for cross-arch emulation)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push multi-arch image to Quay.io (linux/amd64 + linux/arm64)
        run: make -C backup/pvc docker-release
